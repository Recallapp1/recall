name: CI

# Every branch push runs CI: `main` is protected and accepts a commit only
# after `check` and `e2e` passed on it (docs/06-operations/DEPLOYMENT.md).
on:
  push:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fails on high or critical advisories in what ships to production.
      - run: pnpm audit --prod --audit-level high
      - run: pnpm lint
      - run: pnpm lint:tokens
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test
      # Same build Vercel runs, against placeholder settings: no database or
      # provider is contacted (pages that read data render per request).
      - run: pnpm build
        env:
          APP_URL: https://ci.recall.invalid
          DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
          BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-0123456789
          NEXT_TELEMETRY_DISABLED: "1"

  e2e:
    # The real app (production build) against a throwaway in-memory database.
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: pnpm e2e
        shell: bash
        run: |
          set -o pipefail
          timeout 600 pnpm e2e 2>&1 | tee e2e.log
        env:
          CI: "true"
          DEBUG: pw:webserver
      # Job logs need admin rights; annotations are public, so the tail of a
      # failed run is readable from the API by anyone working on the repo.
      - name: report e2e failure
        if: failure()
        shell: bash
        run: |
          tail -n 80 e2e.log | cut -c1-200 | tr -d '\r' | awk '{ gsub(/%/, "%25"); printf "%s%%0A", $0 }' > tail.txt
          echo "::error title=e2e log tail::$(cat tail.txt)"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
