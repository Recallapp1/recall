name: CI

# Every branch push runs CI: `main` is protected and accepts a commit only
# after `check` and `e2e` passed on it (docs/06-operations/DEPLOYMENT.md).
on:
  push:
    branches: ["**"]

# Least privilege (audit F-16): the jobs only read the repository. Dependabot
# branches run the same checks with GitHub's read-only token and no secrets;
# no workflow here uses pull_request_target or repository secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fails on high or critical advisories in what ships to production.
      - run: pnpm audit --prod --audit-level high
      - run: pnpm lint
      - run: pnpm lint:tokens
      # Secret-like strings in tracked files fail the build (B5).
      - run: pnpm lint:secrets
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test
      # Same build Vercel runs, against placeholder settings: no database or
      # provider is contacted (pages that read data render per request).
      - run: pnpm build
        env:
          APP_URL: https://ci.recall.invalid
          DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
          BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-0123456789
          NEXT_TELEMETRY_DISABLED: "1"

  e2e:
    # The real app (production build) against a throwaway in-memory database.
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: pnpm e2e
        shell: bash
        run: |
          set -o pipefail
          timeout 600 pnpm e2e 2>&1 | tee e2e.log
        env:
          CI: "true"
          DEBUG: pw:webserver
      # Job logs need admin rights; annotations are readable from the API by
      # anyone with access to the repo, so the tail is redacted first (B2).
      - name: report e2e failure
        if: failure()
        shell: bash
        run: |
          tail -n 80 e2e.log | node scripts/redact-log.mjs | cut -c1-200 | tr -d '\r' | awk '{ gsub(/%/, "%25"); printf "%s%%0A", $0 }' > tail.txt
          echo "::error title=e2e log tail::$(cat tail.txt)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          # Synthetic data only, kept briefly (B2).
          retention-days: 3
