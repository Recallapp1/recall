name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fails on high or critical advisories in what ships to production.
      - run: pnpm audit --prod --audit-level high
      - run: pnpm lint
      - run: pnpm lint:tokens
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test
      # Same build Vercel runs, against placeholder settings: no database or
      # provider is contacted (pages that read data render per request).
      - run: pnpm build
        env:
          APP_URL: https://ci.recall.invalid
          DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
          BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-0123456789
          NEXT_TELEMETRY_DISABLED: "1"

  e2e:
    # The real app (production build) against a throwaway in-memory database.
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
